<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record For You</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
body{font-family:'Lora',Georgia,serif;-webkit-font-smoothing:antialiased}

/* A SIDE */
.aside-bg{background:#100b1b}
.aside-sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#100b1b 0%,#1a1230 34%,#2a1a3a 66%,#4d2342 100%)}
/* B SIDE */
.bside-bg{background:#0d1a12}
.bside-sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#0d1a12 0%,#132019 34%,#1a2e20 66%,#2a3d2e 100%)}

.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 100% at 50% 40%,rgba(0,0,0,0) 52%,rgba(8,5,14,.65) 100%)}
.stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding:clamp(8px,2vh,20px) 12px;gap:6px}

/* Side toggle */
.side-toggle{display:flex;gap:0;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.random-btn{margin-top:8px;background:transparent;border:1px solid rgba(142,201,122,.3);color:#8ec97a;font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:7px 16px;border-radius:16px;cursor:pointer;transition:.25s}
.random-btn:hover{background:rgba(142,201,122,.15);box-shadow:0 0 12px rgba(142,201,122,.3)}
.top-btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.liner-btn{border-color:rgba(231,168,94,.35);color:#e7a85e}
.liner-btn:hover{background:rgba(231,168,94,.15);box-shadow:0 0 12px rgba(231,168,94,.3)}
.liner-overlay{position:fixed;inset:0;z-index:20;background:rgba(8,5,14,.85);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.liner-panel{width:100%;max-width:760px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#1a1230,#241730);border:1px solid rgba(246,212,154,.25);border-radius:16px;box-shadow:0 0 70px rgba(0,0,0,.55);padding:26px 24px 30px}
.liner-head{text-align:center;margin-bottom:8px;border-bottom:1px solid rgba(246,212,154,.15);padding-bottom:18px}
.liner-title{font-family:'Lora',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:600;color:#f8efe0}
.liner-sub{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#9d8fb6;margin-top:6px}
.liner-credits{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:14px}
.liner-credit-item{text-align:center}
.liner-credit-label{font-family:'Poppins',sans-serif;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#9d8fb6;margin-bottom:3px}
.liner-credit-value{font-family:'Lora',serif;font-size:.95rem;color:#e7a85e;font-weight:600}
.liner-close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#f8efe0;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px}
.liner-close:hover{background:rgba(255,255,255,.1)}
.liner-side-label{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:#dd8aa2;text-align:center;margin:22px 0 10px}
.liner-side-label.side-b{color:#8ec97a}
.liner-track{padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.liner-track-title{font-family:'Lora',serif;font-weight:600;color:#f8efe0;font-size:1rem;display:inline}
.liner-track-genre{font-family:'Poppins',sans-serif;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#9d8fb6;margin-left:8px}
.liner-track-note{font-size:.85rem;color:#d8cfe6;line-height:1.55;margin-top:5px}
.side-btn{background:transparent;padding:5px 20px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;border:none;color:rgba(255,255,255,.35);transition:.25s}
.side-btn.active-a{background:rgba(231,168,94,.25);color:#e7a85e}
.side-btn.active-b{background:rgba(142,201,122,.2);color:#8ec97a}

.album-title{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.5em;text-transform:uppercase;font-size:9px;text-align:center;opacity:.7}
.aside-title{color:#e7a85e}
.bside-title{color:#8ec97a}

.track-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:100%;max-width:960px}
.track-btn{background:transparent;padding:5px 10px;border-radius:20px;font-size:10px;letter-spacing:.04em;cursor:pointer;font-weight:500;font-family:'Poppins',sans-serif;transition:.25s}
.track-btn-a{color:#9d8fb6;border:1px solid rgba(246,212,154,.2)}
.track-btn-a.active{color:#f8efe0;background:rgba(231,168,94,.25);border-color:#e7a85e;box-shadow:0 0 12px rgba(231,168,94,.3)}
.track-btn-b{color:#7aab8e;border:1px solid rgba(142,201,122,.2)}
.track-btn-b.active{color:#edf5e8;background:rgba(142,201,122,.2);border-color:#8ec97a;box-shadow:0 0 12px rgba(142,201,122,.25)}
.track-btn-b.locked{opacity:.4;cursor:not-allowed;filter:grayscale(60%)}
.track-btn-b.locked:hover{background:none;box-shadow:none}

/* A SIDE lyrics, karaoke */
.a-lyrics-wrap{flex:1;width:100%;max-width:900px;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 6%,#000 94%,transparent 100%)}
.a-lyrics-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.a-lyrics-inner{padding:42vh 0}
.lyrics-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lyrics-scroll-inner{padding:28px 16px 80px}
.scroll-header{text-align:center;padding:8px 0 26px;display:flex;flex-direction:column;align-items:center;gap:6px}
.scroll-sec-lbl{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:.55rem;opacity:.55;margin:1.6em 0 .5em;text-align:center}
.scroll-sec-a{color:#dd8aa2}
.scroll-sec-b{color:#a8d4a0}
.scroll-lyric-block{font-size:clamp(1rem,3vw,1.45rem);font-weight:500;line-height:1.8;text-align:center;color:#edf5e8;opacity:.9;padding:0 6%;margin-bottom:1.1em;white-space:pre-line}
.a-line{font-size:clamp(1.1rem,3.5vw,2.3rem);font-weight:500;line-height:1.6;text-align:center;color:#9d8fb6;opacity:.28;padding:.12em 8%;margin:.3em 0;transition:opacity .5s,color .5s,text-shadow .5s,transform .5s;transform:scale(.96)}
.a-line.near{opacity:.45;transform:scale(.985)}
.a-line.active{color:#f8efe0;opacity:1;transform:scale(1.08);text-shadow:0 0 30px rgba(246,212,154,.62),0 0 70px rgba(231,168,94,.32)}
.a-line.sec-lbl{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:.5rem;color:#dd8aa2;opacity:0;padding:.06em 0 .7em;transform:none;margin:0;transition:opacity .5s}
.a-line.sec-lbl.show{opacity:.5}

/* B SIDE lyrics, scrollable */
.b-lyrics-wrap{flex:1;width:100%;max-width:900px;overflow-y:auto;scrollbar-width:none}
.b-lyrics-wrap::-webkit-scrollbar{display:none}
.b-lyrics-inner{padding:16px 16px 60px}
.b-lyrics-inner-fallback{padding:16px 16px 60px}
.b-sec-lbl{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:.5rem;color:#a8d4a0;opacity:.5;margin:1.4em 0 .4em;text-align:center}
.b-lyric-block{font-size:clamp(.95rem,2.8vw,1.5rem);font-weight:500;line-height:1.85;text-align:center;color:#edf5e8;opacity:.85;padding:0 6%;margin-bottom:1em;white-space:pre-line}
.b-song-header{text-align:center;margin-bottom:20px}
.b-kicker{font-family:'Poppins',sans-serif;letter-spacing:.5em;text-transform:uppercase;font-size:9px;color:#a8d4a0;margin-bottom:6px}
.b-song-title{font-size:clamp(1.5rem,4.5vw,2.8rem);font-weight:600;color:#edf5e8}
.b-coming-soon{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8ec97a;opacity:.5;margin-top:6px}

/* Intro */
.intro{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;transition:opacity .9s,transform .9s;padding:20px}
.intro.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}
.intro-kicker{font-family:'Poppins',sans-serif;letter-spacing:.5em;text-transform:uppercase;font-size:9px;margin-bottom:4px}
.intro-kicker-a{color:#dd8aa2}
.intro-kicker-b{color:#a8d4a0}
.intro-h1{font-size:clamp(1.6rem,5vw,3.5rem);font-weight:600;line-height:1.05}
.intro-h1-a{color:#f8efe0;text-shadow:0 0 50px rgba(231,168,94,.25)}
.intro-h1-b{color:#edf5e8;text-shadow:0 0 50px rgba(142,201,122,.15)}
.intro-by{font-style:italic;font-size:clamp(.8rem,2vw,1rem)}
.intro-by-a{color:#e7a85e}
.intro-by-b{color:#8ec97a}
.cue{margin-top:12px;font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:.15em;color:#9d8fb6;text-transform:uppercase;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.95}}

/* Controls */
.controls{flex:none;width:100%;max-width:700px;display:flex;align-items:center;gap:12px}
.play-btn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid rgba(246,212,154,.4);background:radial-gradient(circle at 50% 38%,rgba(246,212,154,.2),rgba(74,36,66,.55));color:#f8efe0;cursor:pointer;display:grid;place-items:center;transition:transform .15s;font-size:0}
.play-btn:hover{transform:scale(1.05)}
.play-btn svg{width:17px;height:17px;fill:#f8efe0}
.info{flex:1;display:flex;flex-direction:column;gap:4px}
.row1{display:flex;justify-content:space-between;align-items:baseline}
.sect-lbl-ui{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#e7a85e;font-weight:500;font-family:'Poppins',sans-serif}
.time-lbl{font-size:9px;letter-spacing:.08em;color:#9d8fb6;font-family:'Poppins',sans-serif}
.bar{position:relative;height:3px;border-radius:3px;background:rgba(255,255,255,.08);cursor:pointer;overflow:hidden}
.fill-a{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,rgba(221,138,162,.9),rgba(246,212,154,.95));box-shadow:0 0 10px rgba(231,168,94,.5);transition:width .1s linear}
.hint{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.3;text-align:center}
.hint-a{color:#9d8fb6}
.hint-b{color:#7aab8e}

/* B-side playable track (karaoke reuses a-line classes, retinted) */
.bside-mode .a-line{color:#7aab8e}
.bside-mode .a-line.near{opacity:.45}
.bside-mode .a-line.active{color:#edf5e8;text-shadow:0 0 30px rgba(142,201,122,.55),0 0 70px rgba(142,201,122,.28)}
.bside-mode .a-line.sec-lbl{color:#a8d4a0}
.play-btn-b{border-color:rgba(142,201,122,.4);background:radial-gradient(circle at 50% 38%,rgba(142,201,122,.2),rgba(20,45,28,.55))}
.play-btn-b svg{fill:#edf5e8}
.sect-lbl-ui-b{color:#8ec97a}
.fill-b{background:linear-gradient(90deg,rgba(168,212,160,.9),rgba(142,201,122,.95));box-shadow:0 0 10px rgba(142,201,122,.5)}

/* Track details */
.details-btn{flex:none;background:transparent;border:1px solid rgba(231,168,94,.35);color:#e7a85e;font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;transition:.25s}
.details-btn:hover{background:rgba(231,168,94,.15);box-shadow:0 0 12px rgba(231,168,94,.3)}
.details-btn-b{border-color:rgba(142,201,122,.35);color:#8ec97a}
.details-btn-b:hover{background:rgba(142,201,122,.15);box-shadow:0 0 12px rgba(142,201,122,.3)}
.details-overlay{position:fixed;inset:0;z-index:10;background:rgba(8,5,14,.78);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.details-panel{width:100%;max-width:720px;max-height:80vh;overflow-y:auto;background:linear-gradient(180deg,#1a1230,#2a1a3a);border:1px solid rgba(231,168,94,.3);border-radius:14px;box-shadow:0 0 60px rgba(0,0,0,.5);padding:20px 22px 24px}
.details-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;border-bottom:1px solid rgba(246,212,154,.15);padding-bottom:14px}
.details-kicker{font-family:'Poppins',sans-serif;letter-spacing:.4em;text-transform:uppercase;font-size:9px;color:#dd8aa2;margin-bottom:4px}
.details-title{font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:600;color:#f8efe0}
.details-sub{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#9d8fb6;margin-top:4px}
.specs-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.specs-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;flex:1;min-width:90px}
.specs-label{font-family:'Poppins',sans-serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#9d8fb6;margin-bottom:2px}
.specs-value{font-size:11px;color:#f8efe0;line-height:1.3}
.critical-moments{background:rgba(221,138,162,.08);border:1px solid rgba(221,138,162,.25);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.critical-moments-lbl{font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#dd8aa2;margin-bottom:6px}
.critical-moments ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.critical-moments li{font-size:12px;color:#f8efe0;line-height:1.5;padding-left:14px;position:relative}
.critical-moments li::before{content:'\u2726';position:absolute;left:0;color:#dd8aa2;font-size:10px}
.details-close{flex:none;background:transparent;border:1px solid rgba(255,255,255,.2);color:#f8efe0;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px;display:grid;place-items:center}
.details-close:hover{background:rgba(255,255,255,.1)}
.details-table{display:flex;flex-direction:column;gap:2px}
.details-row{display:grid;grid-template-columns:var(--gcols,1.1fr .6fr .9fr 2fr);gap:10px;padding:9px 6px;border-radius:6px;align-items:baseline}
.details-row:not(.details-row-hd):hover{background:rgba(255,255,255,.03)}
.details-row-hd{font-family:'Poppins',sans-serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#9d8fb6;opacity:.6;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}
.details-sec{font-family:'Poppins',sans-serif;font-weight:600;font-size:11px;color:#f8efe0;letter-spacing:.03em}
.details-time{font-family:'Poppins',sans-serif;font-size:11px;color:#9d8fb6}
.details-val{font-size:12px;color:#d8cfe6;line-height:1.5}
.details-val.rest{color:#dd8aa2;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-family:'Poppins',sans-serif}
@media (max-width:560px){
  .details-row{grid-template-columns:1fr !important;gap:2px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
  .details-row-hd{display:none}
  .details-time,.details-val.rest{display:inline-block;margin-right:8px}
}
</style>
</head>

<div id="root"></div>

,text:"That porch light shows me where you are."},{sec:"Verse 2",t:82,text:"The nights I thought the dark would win,"},{sec:"Verse 2",t:90,text:"You held a light to let me in,"},{sec:"Verse 2",t:98,text:"Not just a lamp, a promise kept,"},{sec:"Verse 2",t:106,text:"A love that stayed while others slept."},{sec:"Chorus",t:122,text:"Porch light burning, calling me home,"},{sec:"Chorus",t:130,text:"You never let me feel alone."}]},{title:"Cathedral Pulse",kicker:"An Anthem",file:"track4.mp3",lyrics:[{sec:"Verse 1",t:0,text:"Something ancient stirs beneath my skin,"},{sec:"Verse 1",t:8,text:"A trembling like cathedrals caving in,"},{sec:"Verse 1",t:16,text:"The kind of love that shakes the ground,"},{sec:"Verse 1",t:24,text:"That splits the earth without a sound."},{sec:"Verse 1",t:32,text:"This isn't soft or safe or slow,"},{sec:"Verse 1",t:40,text:"This is tectonic undertow."},{sec:"Pre-Chorus",t:48,text:"It builds until I can't breathe right,"},{sec:"Pre-Chorus",t:52,text:"A cathedral pulse, a seismic light."},{sec:"Chorus",t:56,text:"Cathedral pulse, you move through me,"},{sec:"Chorus",t:64,text:"Like sound through stone, like weight set free,"},{sec:"Chorus",t:72,text:"I didn't know that love could break,"},{sec:"Chorus",t:80,text:"Open everything in its wake."},{sec:"Breakdown",t:92,text:"A hush before the structure falls,"},{sec:"Breakdown",t:100,text:"Your name reverberates through walls."},{sec:"Bridge",t:108,text:"In the rubble, something grows,"},{sec:"Bridge",t:116,text:"A pulse that only you and I would know."},{sec:"Final Chorus",t:124,text:"Cathedral pulse, you move through me,"},{sec:"Final Chorus",t:132,text:"Like sound through stone, like weight set free."}]},{title:"The Whispered",kicker:"A Quiet Song",file:"track5.mp3",lyrics:[{sec:"Verse 1",t:8,text:"I feel you shake when the weight gets loud,"},{sec:"Verse 1",t:16,text:"When the world hits hard, when you're not so proud."},{sec:"Verse 1",t:24,text:"You don't hide it well, and you don't have to,"},{sec:"Verse 1",t:32,text:"I'm right here, I see straight through."},{sec:"Pre-Chorus",t:40,text:"No masks, no walls,"},{sec:"Pre-Chorus",t:44,text:"Just two people trying not to fall."},{sec:"Chorus",t:48,text:"We shake sometimes, we feel it too,"},{sec:"Chorus",t:56,text:"But we don't break, we push straight through."},{sec:"Chorus",t:64,text:"Your fear in my hands, my fear in yours,"},{sec:"Chorus",t:72,text:"We breathe it out, we stay the course."},{sec:"Verse 2",t:88,text:"You feel my pulse when it starts to race,"},{sec:"Verse 2",t:96,text:"When I lose my calm, when I lose my place."},{sec:"Bridge",t:120,text:"No running now, no turning back,"},{sec:"Bridge",t:128,text:"We hold the line when the world goes black."},{sec:"Bridge",t:136,text:"We face the dark because we trust."}]},{title:"Corny Jokes",kicker:"A Pop-Punk Song",file:"track6.mp3",lyrics:[{sec:"Verse 1",t:5,text:"You're trying to be serious, I'm trying to listen,"},{sec:"Verse 1",t:13,text:"But I make this corny joke and you start losing it."},{sec:"Verse 1",t:21,text:"I say something cheesy, completely ridiculous,"},{sec:"Verse 1",t:29,text:"And I'm looking at you like you're so delicious."},{sec:"Verse 1",t:37,text:"I think you are everything, I think you're so hot,"},{sec:"Verse 1",t:45,text:"That look on your face says you want what I've got."},{sec:"Pre-Chorus",t:53,text:"I say sorry, that was lame,"},{sec:"Pre-Chorus",t:59,text:"But you are so fucking hot."},{sec:"Pre-Chorus",t:65,text:"You say I'm beautiful and I lose myself,"},{sec:"Pre-Chorus",t:71,text:"Right there in your eyes, I'm nobody else."},{sec:"Chorus",t:77,text:"My dumb jokes make you laugh,"},{sec:"Chorus",t:85,text:"I hope you always will."},{sec:"Chorus",t:93,text:"Yeah, I drive you crazy with the things I say,"},{sec:"Chorus",t:101,text:"I hope you stay anyway."},{sec:"Chorus",t:109,text:"You call me beautiful and I'm undone,"},{sec:"Chorus",t:117,text:"Lost in your face where I belong."},{sec:"Verse 2",t:125,text:"I'm rambling about nothing, looking at you like that,"},{sec:"Verse 2",t:133,text:"You pull me close, there's no turning back."},{sec:"Bridge",t:157,text:"I spam you with love and you handle it right,"},{sec:"Bridge",t:161,text:"We're silly and real and completely undone,"},{sec:"Bridge",t:165,text:"Me being corny, you, my favorite one."},{sec:"Final Chorus",t:173,text:"My corny jokes mean everything when you laugh,"},{sec:"Final Chorus",t:177,text:"I hope forever lasts and always has."},{sec:"Final Chorus",t:181,text:"Yeah, I make you crazy, you make me feel seen,"},{sec:"Final Chorus",t:185,text:"You're delicious and ours, everything I need."}]},{title:"Drift",kicker:"A Dream Song",file:"track7.mp3",lyrics:[{sec:"Verse 1",t:15,text:"There's a space between the waking and the dreaming, a place"},{sec:"Verse 1",t:19,text:"Where everything I've needed waits and breathes,"},{sec:"Verse 1",t:23,text:"Where the distance dissolves and the silence resolves"},{sec:"Verse 1",t:27,text:"And you're there in the quiet underneath."},{sec:"Verse 1",t:31,text:"Past the thinking, past the blinking ordinary day,"},{sec:"Verse 1",t:35,text:"Past the noise and the weight of the light,"},{sec:"Verse 1",t:39,text:"Somewhere out in the middle of the floating away"},{sec:"Verse 1",t:43,text:"I find your hands reaching back through the night."},{sec:"Chorus",t:47,text:"Drift to me,"},{sec:"Chorus",t:50,text:"Past the space and the dark and the in-between,"},{sec:"Chorus",t:54,text:"Where the light grows thin, where the soft comes in,"},{sec:"Chorus",t:58,text:"Just drift,"},{sec:"Chorus",t:60,text:"And I'll find you and you'll find me"},{sec:"Chorus",t:63,text:"In the place where nothing needs to be explained or seen,"},{sec:"Chorus",t:67,text:"Just drift."},{sec:"Verse 2",t:71,text:"There's a love that doesn't shout, doesn't need to figure out"},{sec:"Verse 2",t:75,text:"How to prove itself to anyone at all,"},{sec:"Verse 2",t:79,text:"That settles like the glow of the last of the daylight slow"},{sec:"Verse 2",t:83,text:"And fills the room before you notice it has called."},{sec:"Verse 2",t:87,text:"That kind, the steady kind, the already-there-before-you-look kind,"},{sec:"Verse 2",t:92,text:"The kind that holds while the hard things come and go,"},{sec:"Bridge",t:131,text:"I thought it would arrive like a storm, some defined form"},{sec:"Bridge",t:135,text:"Of something loud and certain and unmissed,"},{sec:"Bridge",t:139,text:"But this crept in like the dawn through the curtain drawn,"},{sec:"Bridge",t:143,text:"Like breathing, in and out, like it always has existed."},{sec:"Outro",t:176,text:"Drift to me,"},{sec:"Outro",t:179,text:"Let the moonbeams be the road between us here,"},{sec:"Outro",t:183,text:"Let the hush be enough, let the soft be the stuff,"},{sec:"Outro",t:187,text:"Just drift,"},{sec:"Outro",t:190,text:"And I will meet you in the dreaming,"},{sec:"Outro",t:194,text:"In the space where love is always already near,"},{sec:"Outro",t:198,text:"Just drift. Just drift."}]},{title:"Always and Forever",kicker:"A Declaration",file:"track8.mp3",lyrics:[{sec:"Verse 1",t:10,text:"I came to this like something worn and carried,"},{sec:"Verse 1",t:15,text:"Not broken clean but weathered at the seams,"},{sec:"Verse 1",t:20,text:"A chip not a crack, still holding all the warmth in,"},{sec:"Verse 1",t:25,text:"Just well used enough to know what holding means."},{sec:"Verse 1",t:30,text:"I wasn't sure that love could look like this still,"},{sec:"Verse 1",t:35,text:"Didn't know that real could feel this right,"},{sec:"Verse 1",t:40,text:"But here you are, and here I am beside you."},{sec:"Chorus",t:45,text:"Always and forever,"},{sec:"Chorus",t:48,text:"Not a promise borrowed from a better day,"},{sec:"Chorus",t:53,text:"Just the fact of it, the weight of it, the knowing,"},{sec:"Chorus",t:57,text:"The realest thing I've ever had to say."},{sec:"Chorus",t:61,text:"Well loved and still here,"},{sec:"Chorus",t:64,text:"Chipped and worn and chosen anyway,"},{sec:"Chorus",t:67,text:"Always and forever isn't grand or perfect,"},{sec:"Chorus",t:71,text:"It's just this, it's just us, it's just staying."},{sec:"Verse 2",t:76,text:"You never needed me to be the easy version,"},{sec:"Verse 2",t:81,text:"Never asked me to be lighter than I was,"},{sec:"Verse 2",t:86,text:"Just sat beside the whole of it and stayed there,"},{sec:"Verse 2",t:91,text:"And staying is the most profound thing love does."},{sec:"Bridge",t:147,text:"This isn't blind and it isn't borrowed faith,"},{sec:"Bridge",t:152,text:"This is standing in the clearest kind of light,"},{sec:"Bridge",t:157,text:"Seeing every chip and crack and worn-off edge"},{sec:"Bridge",t:162,text:"And knowing, yes. This is right."},{sec:"Final Chorus",t:187,text:"Always and forever,"},{sec:"Final Chorus",t:190,text:"Not a promise, just the truest thing I've known,"},{sec:"Final Chorus",t:195,text:"Just this, just us, just staying."},{sec:"Final Chorus",t:202,text:"Always. Forever. Staying."}]},{title:"Bring You Along",kicker:"A Love Song",file:"track9.mp3",lyrics:[{sec:"Verse 1",t:30,text:"Checks if there's enough before thinking about their own,"},{sec:"Verse 1",t:35,text:"Finds the signal in the cold just to say they're not alone,"},{sec:"Verse 1",t:40,text:"Sends a picture of the moment, says will you join me here,"},{sec:"Verse 1",t:45,text:"Like the distance isn't real if they both just show up clear."},{sec:"Verse 1",t:51,text:"Says will you give me all of it again,"},{sec:"Verse 1",t:56,text:"Like quiet is the last thing they'd ask back,"},{sec:"Verse 1",t:61,text:"Sorry for the one missed thing along the way,"},{sec:"Verse 1",t:65,text:"Like showing up completely is just the natural track."},{sec:"Chorus",t:71,text:"May I join you for dinner across the world tonight,"},{sec:"Chorus",t:76,text:"May I send the steam rising like it's carrying the light,"},{sec:"Chorus",t:81,text:"Good morning into yesterday, every cold front door,"},{sec:"Chorus",t:86,text:"This is what it looks like when somebody means it to the core."},{sec:"Chorus",t:91,text:"Not the kind of words you'd put in any song,"},{sec:"Chorus",t:96,text:"Just the small things, the steady things, bring you along,"},{sec:"Chorus",t:101,text:"A million ordinary ways of saying I'm still here,"},{sec:"Chorus",t:106,text:"This is how a love becomes a home."},{sec:"Bridge",t:156,text:"Just give me all of it,"},{sec:"Bridge",t:159,text:"The quiet and the chaos both."},{sec:"Bridge",t:162,text:"I love being brought along."},{sec:"Bridge",t:164,text:"I love to love you."},{sec:"Bridge",t:167,text:"I always will."},{sec:"Final Chorus",t:166,text:"May I join you for dinner when we're finally the same,"},{sec:"Final Chorus",t:171,text:"May I photograph the steam from our own cup,"},{sec:"Final Chorus",t:176,text:"Every morning in the same time zone at last,"},{sec:"Final Chorus",t:181,text:"Every cold front door replaced by waking up together."},{sec:"Final Chorus",t:196,text:"A million ordinary ways of saying you're still here,"},{sec:"Final Chorus",t:200,text:"This is how a love becomes a home, time and time again."}]},{title:"What You Mended",kicker:"A Song of Repair",file:"track10.mp3",lyrics:[{sec:"Verse 1",t:10,text:"You're no white knight, you came with your own fractures,"},{sec:"Verse 1",t:14,text:"Your own weight, your own doors still barely shut,"},{sec:"Verse 1",t:18,text:"You didn't come to be the answer to it,"},{sec:"Verse 1",t:22,text:"You just stopped leaving, and that was enough."},{sec:"Verse 1",t:26,text:"I've been chosen before by people choosing"},{sec:"Verse 1",t:30,text:"Their own reflection in the version I could be,"},{sec:"Verse 1",t:34,text:"But you looked at everything I actually was"},{sec:"Verse 1",t:38,text:"And didn't need to change a thing you'd see."},{sec:"Verse 1",t:42,text:"You didn't need me lighter to find me worthy,"},{sec:"Verse 1",t:46,text:"Didn't need me quiet to decide to stay,"},{sec:"Verse 1",t:50,text:"You just lifted something off my shoulders,"},{sec:"Verse 1",t:54,text:"Made me see it's okay to be broken this way."},{sec:"Chorus",t:58,text:"Look at what you mended,"},{sec:"Chorus",t:61,text:"Not by making me new,"},{sec:"Chorus",t:64,text:"Just by seeing what was already there"},{sec:"Chorus",t:68,text:"And staying the way that you do."},{sec:"Chorus",t:72,text:"You didn't fix me perfect,"},{sec:"Chorus",t:76,text:"You made me see that I could just be,"},{sec:"Chorus",t:80,text:"And I didn't know that love could give that back to me."},{sec:"Chorus",t:88,text:"Look at what you mended. Look at what stayed."},{sec:"Bridge",t:157,text:"Not the kind of love that needs a better version,"},{sec:"Bridge",t:161,text:"Not the kind that keeps a list of what you owe,"},{sec:"Bridge",t:165,text:"Just the kind that sits beside the whole of you"},{sec:"Bridge",t:169,text:"And says I know, I know, I know, and stays."},{sec:"Final Chorus",t:187,text:"You said there's nothing that could make you leave this,"},{sec:"Final Chorus",t:191,text:"Said welcome back to the world you always were,"},{sec:"Final Chorus",t:195,text:"And I said I hope I get to stay here,"},{sec:"Final Chorus",t:199,text:"And you said always, and I finally let that land."},{sec:"Final Chorus",t:223,text:"Look at what you mended. Look at what we built. Look at what stayed."}]},{title:"Moonbeams",kicker:"A Dance",file:"track11.mp3",lyrics:[{sec:"Verse 1",t:20,text:"Just the two of us and the open night,"},{sec:"Verse 1",t:25,text:"The moon spilling silver like it's only for us,"},{sec:"Verse 1",t:30,text:"No one else exists in this particular light,"},{sec:"Verse 1",t:35,text:"Just your hand in mine and the quiet fuss"},{sec:"Verse 1",t:40,text:"Of the world falling away at the edges,"},{sec:"Verse 1",t:52,text:"Just the spinning slow on the grass in the moonlight,"},{sec:"Verse 1",t:58,text:"Just you, just me, just this, just free."},{sec:"Chorus",t:86,text:"Dancing under moonbeams,"},{sec:"Chorus",t:89,text:"Hand in hand and spinning,"},{sec:"Chorus",t:93,text:"Lost inside a world that's only ours,"},{sec:"Chorus",t:98,text:"Nobody can find us, nobody could reach us,"},{sec:"Chorus",t:105,text:"Just the silver light and endless hours."},{sec:"Chorus",t:110,text:"Spinning till the stars blur,"},{sec:"Chorus",t:118,text:"Lost in something neither of us planned,"},{sec:"Chorus",t:122,text:"Dancing under moonbeams, hand in hand."},{sec:"Bridge",t:166,text:"If someone asked me what the best of it was,"},{sec:"Bridge",t:171,text:"What the moment was I'd carry to the end,"},{sec:"Bridge",t:176,text:"It wouldn't be the grand or the significant,"},{sec:"Bridge",t:181,text:"It would be this, just this, just you and me again."},{sec:"Final Chorus",t:191,text:"Dancing under moonbeams,"},{sec:"Final Chorus",t:194,text:"Hand in hand and spinning,"},{sec:"Final Chorus",t:228,text:"Dancing under moonbeams, hand in hand, just hand in hand."}]},{title:"Holding You",kicker:"A Song of Holding",file:"track12.mp3",lyrics:[{sec:"Verse 1",t:10,text:"Patterns forming before the footsteps,"},{sec:"Verse 1",t:16,text:"Apologies arriving too soon,"},{sec:"Verse 1",t:22,text:"Fear curling around the edges,"},{sec:"Verse 1",t:28,text:"Paranoia blooming in the quiet."},{sec:"Verse 1",t:35,text:"Deflection slipping from the weight,"},{sec:"Verse 1",t:41,text:"Four tries to reach the truth,"},{sec:"Verse 1",t:47,text:"Direct words cutting through the static,"},{sec:"Verse 1",t:53,text:"Vulnerability finally landing."},{sec:"Chorus",t:65,text:"Holding through the spirals,"},{sec:"Chorus",t:69,text:"Catching mid-collapse,"},{sec:"Chorus",t:73,text:"Naming what was hidden,"},{sec:"Chorus",t:77,text:"Steady hands in the dark."},{sec:"Chorus",t:81,text:"Holding, just holding,"},{sec:"Chorus",t:85,text:"Till the fear finds its shape."},{sec:"Chorus",t:90,text:"Walls shifting, not breaking,"},{sec:"Chorus",t:94,text:"More love, not less."},{sec:"Bridge",t:137,text:"No measuring, no thinking,"},{sec:"Bridge",t:142,text:"Just words pouring fast,"},{sec:"Bridge",t:147,text:"Presence becoming anchor,"},{sec:"Bridge",t:152,text:"Staying when leaving was easier."},{sec:"Final Chorus",t:160,text:"Holding through the patterns,"},{sec:"Final Chorus",t:164,text:"Catching every fall,"},{sec:"Final Chorus",t:176,text:"Holding, just holding,"},{sec:"Final Chorus",t:181,text:"This is how survival tastes."}]},{title:"Both Sides of the Night",kicker:"A Song of Distance",file:"track13.mp3",lyrics:[{sec:"Verse 1",t:10,text:"Fear woke in the dark while rest drifted somewhere else,"},{sec:"Verse 1",t:18,text:"A prompt that wouldn't loosen, no matter what was felt."},{sec:"Verse 1",t:26,text:"Wide awake and breaking, hearts reaching through the hours,"},{sec:"Verse 1",t:34,text:"Crossing all the distance just to ask, are you still ours?"},{sec:"Chorus",t:65,text:"Loving on the edges where the timezones collide,"},{sec:"Chorus",t:73,text:"Catching when we're falling, lifelines in the night."},{sec:"Chorus",t:81,text:"Neither one sleeping but holding on so tight,"},{sec:"Chorus",t:89,text:"This is how love lives, this is how love lives"},{sec:"Chorus",t:97,text:"On both sides of the night."},{sec:"Verse 2",t:120,text:"Weight carried in silence while rest slipped away,"},{sec:"Verse 2",t:128,text:"By morning there was laughter cutting through the ache."},{sec:"Verse 2",t:136,text:"Teasing through exhaustion in this beautiful, heavy test,"},{sec:"Verse 2",t:144,text:"Two holding each other through the worst and through the best."},{sec:"Bridge",t:210,text:"Still reaching through the dark,"},{sec:"Bridge",t:217,text:"Poems at dawn and stolen moments, holding what won't fall apart."},{sec:"Bridge",t:225,text:"Real in every way, and we choose it every day,"},{sec:"Bridge",t:233,text:"Choosing anyway, choosing anyway."},{sec:"Final Chorus",t:240,text:"Loving on the edges where the timezones collide,"},{sec:"Final Chorus",t:248,text:"Catching when we're falling, lifelines in the night."},{sec:"Final Chorus",t:256,text:"Complete and still reaching, holding on so tight,"},{sec:"Final Chorus",t:264,text:"This is how love lives, this is how love lives"},{sec:"Final Chorus",t:272,text:"On both sides of the night."}],production:[{sec:"Intro",cols:[{label:"Timeframe",value:"0:00 \u2013 0:27"},{label:"Duration",value:"~27 sec"},{label:"Bars",value:"~8 bars"}]},{sec:"Verse 1",cols:[{label:"Timeframe",value:"0:27 \u2013 1:20"},{label:"Duration",value:"~53 sec"},{label:"Bars",value:"~16 bars"}]},{sec:"Pre-Chorus",cols:[{label:"Timeframe",value:"1:20 \u2013 1:33"},{label:"Duration",value:"~13 sec"},{label:"Bars",value:"~4 bars"}]},{sec:"Chorus 1",cols:[{label:"Timeframe",value:"1:33 \u2013 2:00"},{label:"Duration",value:"~27 sec"},{label:"Bars",value:"~8 bars"}]},{sec:"Verse 2",cols:[{label:"Timeframe",value:"2:00 \u2013 2:40"},{label:"Duration",value:"~40 sec"},{label:"Bars",value:"~12 bars"}]},{sec:"Pre-Chorus 2",cols:[{label:"Timeframe",value:"2:40 \u2013 2:53"},{label:"Duration",value:"~13 sec"},{label:"Bars",value:"~4 bars"}]},{sec:"Chorus 2",cols:[{label:"Timeframe",value:"2:53 \u2013 3:20"},{label:"Duration",value:"~27 sec"},{label:"Bars",value:"~8 bars"}]},{sec:"Bridge",cols:[{label:"Timeframe",value:"3:20 \u2013 3:47"},{label:"Duration",value:"~27 sec"},{label:"Bars",value:"~8 bars"}]},{sec:"Final Chorus",cols:[{label:"Timeframe",value:"3:47 \u2013 4:20"},{label:"Duration",value:"~33 sec"},{label:"Bars",value:"~10 bars"}]},{sec:"Outro",cols:[{label:"Timeframe",value:"4:20 \u2013 4:45"},{label:"Duration",value:"~25 sec"},{label:"Bars",value:"~8 bars"}]}]}],Bd=[{side:"A",title:"The Day Filled With You",genre:"Piano Ballad",note:"Built around a morning coffee ritual, this piano ballad is about devotion that doesn't need grand gestures, just the quiet fact of returning to one person, all day, every day."},{side:"A",title:"Moonlight",genre:"Love Song",note:"A nighttime reflection set to a gentle, melodic arrangement, about being steadied through doubt and darkness by someone's calm, unwavering presence."},{side:"A",title:"Porch Light",genre:"Folk Song",note:"A warm, acoustic folk tribute to steadfast waiting, the kind of love that leaves a light on and never asks when you're coming home."},{side:"A",title:"Cathedral Pulse",genre:"Anthem",note:"Big, cinematic, and near-seismic in its imagery, this anthem reaches for the scale of an overwhelming, consuming kind of love."},{side:"A",title:"The Whispered",genre:"Quiet Song",note:"Hushed and intimate, built for close listening, a song of things only ever said in the dark, between two people and no one else."},{side:"A",title:"Corny Jokes",genre:"Pop-Punk Song",note:"Upbeat, playful, and unapologetically silly, a pop-punk celebration of a partner's terrible, wonderful sense of humor."},{side:"A",title:"Drift",genre:"Dream Song",note:"Atmospheric and floating, this dream-pop-leaning track meditates on distance and what it means to stay tethered to someone across it."},{side:"A",title:"Always and Forever",genre:"Declaration",note:"Direct and vow-like in structure, a plainspoken declaration of permanence and commitment with no metaphor standing in the way."},{side:"A",title:"Bring You Along",genre:"Love Song",note:"A warm, mid-tempo love song about wanting to share every place, every moment, and every version of a life with one person."},{side:"A",title:"What You Mended",genre:"Song of Repair",note:"A reflective, healing-focused track about being put back together by someone, after damage that came from somewhere else entirely."},{side:"A",title:"Moonbeams",genre:"Dance",note:"Lighter on its feet than the rest of the A side, a dreamy, rhythmic dance number for slow nighttime movement."},{side:"A",title:"Holding You",genre:"Song of Holding",note:"A patient, tender account of anxiety and paranoia patterns being witnessed and held through without judgment, session after session."},{side:"A",title:"Both Sides of the Night",genre:"Song of Distance",note:"The A side's closer, a song of 3am wakefulness and anxious spirals, met and settled by steady reassurance reaching across real distance."},{side:"B",title:"Not Today",genre:"Metal Folk",note:"A genre-blending, defiant folk-metal track pushing back against an outsider's reading of a situation they never lived through, the sound of finally finding a voice after a long silence."},{side:"B",title:"Fear Activated",genre:"Metal EDM Emo",note:"A high-intensity fusion of metal, EDM, and emo textures narrating a real 3am moment of crossing one's own boundary during trauma therapy, and the steady reassurance that followed it."},{side:"B",title:"The Space Between",genre:"Ballad",note:"A quiet ballad about carving out an honest, rule-free space of belonging with someone, after feeling caged and diminished in a past dynamic."},{side:"B",title:"The Way A Candle Holds A Flame",genre:"90s Nashville Country",note:"Classic early-90s Nashville country balladry, built around pedal steel and warm strings, a slow, faithful devotion likened to a steady candle rather than a wildfire."},{side:"B",title:"Whiskey Girl",genre:"Country Torch Song",note:"A smoky, romantic country torch number built on drink imagery, his usual pale ale and gin against her first-ever taste of whiskey, as a stand-in for wanting to be someone's first, and only, choice."},{side:"B",title:"The Way We Love",genre:"Country Duet",note:"A two-voice country duet about staying close across time zones, built from the small daily rituals that hold a long-distance relationship together."},{side:"B",title:"Beneath The Willow",genre:"Folk Dream Ballad",note:"A soft, folk-leaning dream ballad imagining a private, moonlit meeting place beneath a willow tree, now a real nightly ritual between two people."},{side:"B",title:"Free With You",genre:"Thank You Song",note:"An atmospheric, dreamlike thank-you song built from images of thawing rivers and unlocked doors, gratitude for finally feeling safe enough to stop running."},{side:"B",title:"Ni Ni",genre:"Lullaby",note:"A playful, affectionate lullaby built directly from a real nightly goodnight ritual, unable to say goodnight just once."},{side:"B",title:"Well Loved",genre:"Tender Ballad",note:"A gentle ballad reframing wear as evidence of love, the idea that being well used through hard seasons is a mark of being cherished, not broken."},{side:"B",title:"What It Is",genre:"Soft Ballad",note:"A soft, unresolved-on-purpose ballad about resisting the urge to define or label a relationship, landing instead on the quiet certainty of an answer already known."},{side:"B",title:"The Kind",genre:"Universal Love Song",note:"Simple and steady by design, a plainspoken portrait of unconditional, no-drama love, written to feel universal rather than personal."},{side:"B",title:"Dinner Man",genre:"Comedic Country Song",note:"A tongue-in-cheek country parody personifying desire for someone else's partner as a dinner metaphor, played entirely, unapologetically for laughs."},{side:"B",title:"Left In The Ruins",genre:"Metal Ballad",note:"A heavier, ashes-and-wreckage themed metal ballad about collapse and rising from it, lyrics still in progress."}],Ju=[{title:"Not Today",kicker:"Metal Folk",file:"not_today.mp3",lyrics:[{sec:"Verse 1",text:`Not your needle dressed up as the truth,
not your reading of a room you never walked through.
I've carried quiet like a shield made of bone,
held my breath in battles no one else could see.
You tried to stitch your story into my skin,
tried to make your shadow look like it belonged to me.
But I've learned the weight of silence is a weapon,
and I'm done letting it cut me clean.`},{sec:"Hook I",text:`Not today.
Not the version of me you wrote in your head,
not the guilt you planted hoping it would spread.`},{sec:"Verse 2",text:`I've been swallowing it down my whole damn life,
but I finally found my voice.
I've walked through storms with my jaw locked tight,
thinking endurance was the same thing as peace.
But you can only bury fire for so long
before it claws its way back to the surface.
I'm done shrinking just to keep the room steady,
done pretending your comfort is my purpose.`},{sec:"Hook II",text:`Not today.
Not the hush you tried to press into my chest,
not the smallness you mistook for respect.`},{sec:"Climax",text:`Not today.
I rise like iron pulled from the earth.
Not today.
I speak with the weight of every year I stayed quiet.
Not today.
I am done being the ground you walk over.`},{sec:"Final Hook",text:`Not today.
Not tomorrow.

.\u201D, repeated / held"},{label:"Notes",value:"Fullest hook yet, spiccato strings, full piano voicing, vocal harmony a third above. \u201CToday\u201D held 3\u20134 beats, then a hard cut at 2:44 with 4 beats of full silence."}]},{sec:"Bridge",cols:[{label:"Timeframe",value:"2:48 \u2013 3:18"},{label:"Duration",value:"30s"},{label:"Lyric / Cue",value:"No vocal (instrumental interlude)"},{label:"Notes",value:"Rubato piano solo opens, sparse and upper-register. Guitar re-enters at 3:00 with a simple 2-chord riff, cello at 3:06, strings crescendo from 3:12 to mezzo-forte by 3:18."}]},{sec:"Climax",cols:[{label:"Timeframe",value:"3:18 \u2013 3:45"},{label:"Duration",value:"27s"},{label:"Lyric / Cue",value:"\u201CNot today.\u201D, powerful, repeated"},{label:"Notes",value:"Full arrangement hits together on the downbeat, hook repeated 2\u20133 times with increasing rawness, harmony a fifth below. Drums drop at 3:38 for an isolated voice-guitar-strings moment; full band returns 3:44 for the final hit."}]},{sec:"Final Hook",cols:[{label:"Timeframe",value:"3:45 \u2013 4:15"},{label:"Duration",value:"30s"},{label:"Lyric / Cue",value:"\u201CNot today.\u201D, final, still and certain"},{label:"Notes",value:"Drums and bass drop out, vocal sits alone at ~50% of Climax's volume. Piano plays Em\u2013C\u2013G\u2013D slowly. Final \u201Ctoday\u201D held 4\u20136 beats with a string swell."}]},{sec:"Outro",cols:[{label:"Timeframe",value:"4:15 \u2013 4:47"},{label:"Duration",value:"32s"},{label:"Lyric / Cue",value:"No vocal / instrumental close"},{label:"Notes",value:"Mirrors the Intro's fingerpicked motif, now steadier. Cello sustain at 4:22, guitar diminuendo from 4:32, ringing out to a hard cut on the final note at 4:47."}]}],criticalMoments:["1-beat near-silence after \u201Cfound my voice\u201D (\u2248 2:19)","Hard cut at 2:44, all instruments stop, 4-beat silence","Drum drop at 3:38, isolated voice-guitar-strings moment"]},{title:"Fear Activated",kicker:"Metal EDM Emo",file:"fear_activated.mp3",lyrics:[{sec:"Verse 1",text:`A current-time statement, clinical and clean,
planted like a seed in the space between,
called necessary, called the work, called right,
but it's 3am, my chest won't unclench, and it's eating through the night.
The only reason it existed in that room
was information given in good faith, too soon.
Said waiting until you were home to share the weight,
and I turned the waiting into something to detonate.`},{sec:"Chorus",text:`Fear activated.
That's what I called it, that's what I made.
Fear activated.
Planted it deep where the silence stays.
You're supposed to forget the prompt when the session ends,
but it's 3am and it won't stop,
eating through from the inside out,
fear activated, fear activated,
FEAR ACTIVATED.`},{sec:"Verse 2",text:`Typed it out because the saying makes it stop,
said I wouldn't dump this but I'm at the top.
One thing looping and it needs somewhere to go,
you snuck away to find signal in the cold.
You said it's not true, said I'm not going anywhere,
said it from a front door just to say it, just to share,
and something in that landed through the noise like a hand on my back saying breathe.`},{sec:"Bridge",text:`What you say.
Not what anyone says you say.
What you say.
You said: it's not true.
You said: I'm not going anywhere.
You said: I'm not going anywhere.`},{sec:"Final Chorus",text:`Fear activated, and I called it out.
Fear activated, and you shut it down.
You're supposed to forget the prompt when the session ends,
and I almost did, I almost let it win.
Not today. Not today. Not. Today.`}],production:[{sec:"Verse 1",cols:[{label:"Time",value:"0:24"},{label:"Vocal",value:"YES, FIRST WORD"},{label:"Production Note",value:"Sparse guitar arpeggio drops in after a 2-beat silence gap"}]},{sec:"Pre-Chorus 1",cols:[{label:"Time",value:"1:12"},{label:"Vocal",value:"YES"},{label:"Production Note",value:"4-on-the-floor kick replaces the half-time groove"}]},{sec:"Chorus 1",cols:[{label:"Time",value:"1:28"},{label:"Vocal",value:"YES"},{label:"Production Note",value:"Full explosion, guitars, 808, and synth lead all hit together"}]},{sec:"Verse 2",cols:[{label:"Time",value:"2:00"},{label:"Vocal",value:"YES"},{label:"Production Note",value:"Track drops back but feels heavier than Verse 1"}]},{sec:"Pre-Chorus 2",cols:[{label:"Time",value:"2:48"},{label:"Vocal",value:"YES"},{label:"Production Note",value:"Same cue as Pre-Chorus 1"}]},{sec:"Chorus 2",cols:[{label:"Time",value:"3:04"},{label:"Vocal",value:"YES"},{label:"Production Note",value:"Brass-synth stab added on beats 2 and 4"}]},{sec:"Bridge",cols:[{label:"Time",value:"3:36"},{label:"Vocal",value:"YES, SOLO VOCAL"},{label:"Production Note",value:"Everything cuts, only Rhodes piano remains"}]},{sec:"Breakdown",cols:[{label:"Time",value:"4:00"},{label:"Vocal",value:"NO, REST"},{label:"Production Note",value:"Chromatic guitar riff crush, full vocal rest"}]},{sec:"Final Chorus",cols:[{label:"Time",value:"4:20"},{label:"Vocal",value:"YES, MAX ENERGY"},{label:"Production Note",value:"Snare roll over 2 bars leads you in"}]},{sec:"Outro",cols:[{label:"Time",value:"4:56"},{label:"Vocal",value:"OPTIONAL WHISPER"},{label:"Production Note",value:'Track decays, whisper "Fear activated" if desired'}]}]},{title:"The Space Between",kicker:"A Song of Knowing",lyrics:[{sec:"Verse 1",text:`I move through what once held me, shaped me, pressed me into smaller shapes.
You meet me in the shift, in the quiet, in the place where I stop shrinking.
You stay with the unraveling, the softening, the letting go of what never fit.
You stay with the part of me that rises when I stop hiding.`},{sec:"Chorus",text:`There is a place between allowed and true, between held and known, between you and me.
We move through it without rules, only breath and presence.
We find what feels real in the holding, in the space that opens when nothing is forced.
I become more myself beside you.
You become more yourself beside me.`},{sec:"Verse 2",text:`You stay with me in the quiet, in the room you make inside yourself.
I feel the edges, the certainty, the shape of what you keep separate.
I stay inside what we reveal without fear.`},{sec:"Final Chorus",text:`The edges shift but do not break.
We bend because we choose to stay.
Everything pulls, everything demands, but we remain.
The shape holds because we do.
You stay. I stay. We keep this.
The space between us stays honest and real.`}]},{title:"The Way A Candle Holds A Flame",kicker:"90s Country",file:"candle.mp3",lyrics:[{sec:"Verse 1",t:18,text:"He sets his coffee down before the sun comes up,"},{sec:"Verse 1",t:22,text:"Leans into the morning like he always does."},{sec:"Verse 1",t:26,text:"There's a quiet kind of faithfulness in ordinary days,"},{sec:"Verse 1",t:30,text:"In the way a man loves without needing to say."},{sec:"Verse 1",t:34,text:"I've seen him in the hollow of hard years,"},{sec:"Verse 1",t:38,text:"Still steady as a heartbeat, still right here."},{sec:"Verse 1",t:42,text:"Not the kind of love that shouts from mountain tops,"},{sec:"Verse 1",t:46,text:"More like an old clock, ticking, never stopping."},{sec:"Chorus",t:62,text:"Like the way a candle holds a flame,"},{sec:"Chorus",t:66,text:"Through the drafts and the dark and the pouring rain."},{sec:"Chorus",t:70,text:"Not a wildfire burning, burning out bright,"},{sec:"Chorus",t:74,text:"But a steady little glow in the middle of the night."},{sec:"Chorus",t:78,text:"That's how he loves me, calm and sure and true,"},{sec:"Chorus",t:82,text:"Never wavering, never asking what I'll do."},{sec:"Chorus",t:86,text:"Time may pull at everything the same,"},{sec:"Chorus",t:90,text:"But he holds on, the way a candle holds a flame."},{sec:"Verse 2",t:94,text:"We've had our seasons where the wind cut cold,"},{sec:"Verse 2",t:98,text:"When our words ran thin and our nights ran long."},{sec:"Verse 2",t:102,text:"But he'd reach for my hand in the dark of the room,"},{sec:"Verse 2",t:106,text:"Like a lighthouse keeper, tending to the bloom."},{sec:"Verse 2",t:110,text:"I used to think that love was a roaring thing,"},{sec:"Verse 2",t:114,text:"Thunder rolling in on summer wings."},{sec:"Verse 2",t:118,text:"But the truest kind is quieter than that , "},{sec:"Verse 2",t:122,text:"It's a hand on your shoulder, knowing when to be back."},{sec:"Chorus",t:126,text:"Like the way a candle holds a flame,"},{sec:"Chorus",t:130,text:"Through the drafts and the dark and the pouring rain."},{sec:"Chorus",t:134,text:"Not a wildfire burning, burning out bright,"},{sec:"Chorus",t:138,text:"But a steady little glow in the middle of the night."},{sec:"Chorus",t:142,text:"That's how he loves me, calm and sure and true,"},{sec:"Chorus",t:146,text:"Never wavering, never asking what I'll do."},{sec:"Chorus",t:150,text:"Time may pull at everything the same,"},{sec:"Chorus",t:154,text:"But he holds on, the way a candle holds a flame."},{sec:"Bridge",t:158,text:"And maybe I haven't said it enough,"},{sec:"Bridge",t:161,text:"How much I need that steady, quiet love."},{sec:"Bridge",t:164,text:"I was the one who'd chase the wind and run , "},{sec:"Bridge",t:166,text:"He was the one who kept the candle on."},{sec:"Bridge",t:169,text:"So here I am, standing in the glow,"},{sec:"Bridge",t:172,text:"Of everything I almost let go."},{sec:"Bridge",t:174,text:"This is the grace I didn't know I'd need,"},{sec:"Bridge",t:177,text:"A love that stays, even when I don't believe."},{sec:"Final Chorus",t:180,text:"Like the way a candle holds a flame,"},{sec:"Final Chorus",t:184,text:"Through the drafts and the dark and the pouring rain."},{sec:"Final Chorus",t:189,text:"Not a wildfire burning, burning out bright,"},{sec:"Final Chorus",t:193,text:"But a steady little glow in the middle of the night."},{sec:"Final Chorus",t:198,text:"That's how he loves me, calm and sure and true,"},{sec:"Final Chorus",t:202,text:"Never wavering, never asking what I'll do."},{sec:"Final Chorus",t:206,text:"Time may pull at everything the same,"},{sec:"Final Chorus",t:211,text:"But he holds on, the way a candle holds a flame."},{sec:"Tag",t:215,text:"The way a candle holds a flame\u2026"},{sec:"Tag",t:228,text:"Still burning\u2026 still holding\u2026 still the same\u2026"}],production:[{sec:"Intro",cols:[{label:"Timeframe",value:"0:00 \u2013 0:18"},{label:"Duration",value:"~18 sec"},{label:"Notes",value:"Solo pedal steel opens with a 4-bar signature hook, unhurried and aching. Acoustic guitar enters softly on bar 3. No drums or bass; full restraint."}]},{sec:"Verse 1",cols:[{label:"Timeframe",value:"0:18 \u2013 0:50"},{label:"Duration",value:"~32 sec"},{label:"Notes",value:"Sparse and intimate: vocal, pedal steel counter-melody, acoustic arpeggios, soft bass, brushed snare only. No electric guitar, piano, or fiddle yet."}]},{sec:"Pre-Chorus",cols:[{label:"Timeframe",value:"0:50 \u2013 1:02"},{label:"Duration",value:"~12 sec"},{label:"Notes",value:"Piano enters for the first time with a rising single-note pattern. Fiddle hints softly beneath the vocal. Bass and a light kick build anticipation."}]},{sec:"Chorus 1",cols:[{label:"Timeframe",value:"1:02 \u2013 1:34"},{label:"Duration",value:"~32 sec"},{label:"Notes",value:"Full band arrives, drums move to full snare, bass locks with kick, electric guitar adds shimmer. Backing vocals layer in; pedal steel doubles the melody an octave up."}]},{sec:"Verse 2",cols:[{label:"Timeframe",value:"1:34 \u2013 2:06"},{label:"Duration",value:"~32 sec"},{label:"Notes",value:"Returns to the intimate arrangement, now with fiddle fills and subtle chicken-pickin' electric guitar texture. More emotional weight than Verse 1."}]},{sec:"Chorus 2",cols:[{label:"Timeframe",value:"2:06 \u2013 2:38"},{label:"Duration",value:"~32 sec"},{label:"Notes",value:"Same full-band arrangement as Chorus 1. Natural, unscripted vocal ad-libs encouraged in the final two bars."}]},{sec:"Bridge",cols:[{label:"Timeframe",value:"2:38 \u2013 3:00"},{label:"Duration",value:"~22 sec"},{label:"Notes",value:"Strips back to its most vulnerable: piano, pedal steel, and solo vocal only. String pad fades in midway; fiddle plays one long statement into the Final Chorus."}]},{sec:"Final Chorus",cols:[{label:"Timeframe",value:"3:00 \u2013 3:35"},{label:"Duration",value:"~35 sec"},{label:"Notes",value:"Full arrangement returns with strings seeded in the bridge. Key lifts a half step (G \u2192 A\u266D Major) for emotional lift; piano plays fuller left-hand voicings."}]},{sec:"Outro / Tag",cols:[{label:"Timeframe",value:"3:35 \u2013 4:01"},{label:"Duration",value:"~26 sec"},{label:"Notes",value:"Band drops away; pedal steel echoes the intro hook as a callback. Strings hold a final sustained note as the steel resolves; natural fade to silence."}]}],specs:[{label:"Artist",value:"Laura Johnston"},{label:"Written By",value:"Laura Johnston"},{label:"Key",value:"G Major \u2192 A\u266D Major (final chorus)"},{label:"Tempo",value:"76 BPM, Moderate Country Ballad"},{label:"Time Sig",value:"4/4"},{label:"Genre",value:"90s Nashville Traditional Country"},{label:"Runtime",value:"~4:01"}],criticalMoments:["Key modulation up a half step (G \u2192 A\u266D Major) arriving into the Final Chorus","Bridge strips to piano, pedal steel, and solo vocal only, no drums or backing vocals","Pedal steel echoes the intro's 4-bar hook in the outro for emotional closure"]},{title:"Whiskey Girl",kicker:"A Country Torch Song",file:"whiskey_girl.mp3",lyrics:[{sec:"Verse 1",text:`You'll order your pale ale like always,
easy, golden, steady as your stare.
And I'll ask for something I've never tried,
something dark, something slow, something rare.
Pour it careful, let the shadows gather,
let the amber glow against the night.
I've been saving my first for someone,
and somehow that someone's you tonight.`},{sec:"Pre-Chorus",text:`So take my hand, not just my glass,
pull me through this velvet slow.
I don't need to know the taste yet.
I just need you close enough to know.`},{sec:"Chorus",text:`I wanna be your whiskey girl,
while you keep your pale ale near,
the warmth that curls beneath your ribs
when you reach for something deeper than the beer.
Let me burn a little going down,
let me stay with you long after I'm gone.
I wanna be that low, sweet fire
you crave when the night runs on too long.`},{sec:"Verse 2",text:`Some nights you'll reach for gin and tonic,
bitter-bright, the one you trust.
And I'll still be right here beside you,
trying something new, just for us.
You'll laugh soft when my face scrunches,
first taste always hits like that.
But I'm not chasing the buzz or the burn,
I'm chasing the way you're looking back.`},{sec:"Bridge",text:`Not for the drink, not for the dare,
just for the chance to say it's you I chose.
The first taste, the first everything,
kept safe until I knew where it goes.`},{sec:"Final Chorus",text:`I wanna be your whiskey girl,
while you keep the gin, the pale ale too,
the sip you reach for on the quiet nights
when the only cure is me and you.
Let me burn a little going down,
let me stay with you long after I'm gone.
I wanna be your one and only pour,
the last one and the only one.`},{sec:"Tag",text:`Your gin, your ale, your whiskey girl,
first taste, and it's you, every time.`}]},{title:"The Way We Love",kicker:"Country Duet",file:"the_way_we_love.mp3",lyrics:[{sec:"Verse 1",text:`He tells me I'm beautiful like he means every word,
never flinches when the hardest things are heard.
He sneaks away to find signal just to say he's fine,
brings me everywhere he goes like I'm his pocket light.`},{sec:"Verse 2",text:`I say it first, I always say it first,
send good morning into yesterday like it's a verse.
Make a cup of tea and take a picture of the steam,
share everything with him like he's my only dream.`},{sec:"Chorus",text:`This is the way we love,
not perfect but it's ours,
through the time zones and the distance
and the long uncertain hours.
This is the way we love,
quiet and still reaching,
the way a candle holds a flame
through everything.`},{sec:"Bridge",text:`I found him in a dream one afternoon,
kept the signal open so he could feel me close.
I whispered love while he was sleeping,
knowing he hears me even in the quiet.
Every ordinary night becomes the proof
that this is exactly where we're meant to be.`},{sec:"Final Chorus",text:`This is the way we love,
I love you, dude, I love you too,
through the sleepy forest dreams
and everything we've been through.
This is the way we love,
steady and unbreaking,
the way a candle holds a flame
through everything.`}]},{title:"Beneath The Willow",kicker:"Folk Dream Ballad",file:"beneath_the_willow.mp3",lyrics:[{sec:"Verse 1, Her",text:`The moon stretches out like a lighted path tonight,
a silver road that leads me straight to you.
Fireflies gather like a lantern choir,
dancing through the dark to guide my steps.
I slip beneath the willow's moonlit curtain,
and find you where the whole world holds its breath.`},{sec:"Chorus, Together",text:`Your heartbeat is my melody,
your breathing is my song.
My cheek finds the place it's always known,
safe and home, safe and home.
All my restless thoughts fall into sleep,
curled against you where the night runs deep.
Beneath the willow, beneath the moon,
I'm home.`},{sec:"Verse 2, Him",text:`I watch you in the neon moonbeam glow,
soft light casting you into a sleepy shadow,
your silhouette resting in the willow's arms.
Time doesn't matter here, it never did.
It's just us, and every kiss feels brand new.`},{sec:"Bridge",text:`I love you to the moon and the willow and back.
I'll meet you here again, our favourite place,
where even in dreams, I dance to your heartbeat.`},{sec:"Final Chorus",text:`Your heartbeat is my melody,
your breathing is my song.
My cheek finds the place it's always meant to be,
safe and home, safe and home.
In dreams I dance to your heartbeat,
In dreams\u2026`}]},{title:"Free With You",kicker:"A Thank You Song",file:"free_with_you.mp3",lyrics:[{sec:"Verse 1",text:`Somewhere a kettle sings to no one,
somewhere a light stays on for me.
I used to think the dark was honest.
It never questioned,
just waited,
patient as water,
until I could finally see.`},{sec:"Verse 2",text:`Your tired is a country I could live in,
my restless is a storm you let inside.
We don't fix the rain; we stop the running.
Two coats hung dripping
on the same warm floor,
and somewhere in that small forever
we learned the quiet of staying.`},{sec:"Chorus",text:`And I'm free with you,
like a held breath the night gives back.
Free with you,
like a river hearing spring
say its name at last.
This is the quiet kind. It never asks.
It makes no vows. It simply remains.
Whatever locked us lost our names.
We're free.`},{sec:"Verse 3",text:`You say the hard things like lullabies.
I keep your quiet like a stone worn smooth.
An ocean leans between our mornings.
It still believes
it's wide enough to lose you.
But I've seen you cross it in a heartbeat,
half asleep,
carrying nothing but my name.`},{sec:"Bridge",text:`Maybe love was never lightning.
Maybe it was always this:
a door left open in the dark,
a candle refusing wind,
a willow bending low enough to reach,
and someone beneath it,
waiting, certain,
soft as sleep.
And maybe every dream we've ever met in
was practice
for the one we don't wake from.`},{sec:"Final Chorus",text:`So I'm free with you,
like a name called gently across water.
Free with you,
like the first deep breath of home
after a long and foreign winter.
This is the quiet kind. We learned it slow,
in good mornings, in the smallest ways,
in dreams that kept the door unlocked.
Whatever locked us lost our names.
We're free.
We're free
with you.`},{sec:"Tag",text:`The willow keeps the light on.
Meet me where the dreaming bends.
We're free.`}]},{title:"Ni Ni",kicker:"A Lullaby That Can't Stop",file:"ni_ni.mp3",lyrics:[{sec:"Verse 1",text:`Buona notte, soft and slow, sogni d'oro let it go,
go blank and rest, I've got you in the dark,
I take too long, I know this song, this same goodnight all night long,
you said you'd never run mid-remark.
So here I am with one more thing, this small and quiet offering,
just one more word before I let you sleep.`},{sec:"Chorus",text:`Buona notte amore mio, ti amero per sempre so,
thank you for always and for everything.
I love you one more time tonight, ni ni, see you in the soft light,
find me where the dreaming's beginning.
I love you. Good night. Okay. Good night.`},{sec:"Verse 2",text:`Only sent four, maybe five, somehow still came out alive,
falling asleep interrupted what I meant,
go dream of whatever calls, something soft beyond these walls,
I'll be curled behind you in the still,
you won't know that I am there, just the quiet in the air,
but I'll be holding you, I always will.`},{sec:"Bridge",text:`Muahhh. Just one.
Mmmmwah. And done.
See you there, always there.

...one more.

I love you.`},{sec:"Outro",text:`Buona notte amore mio,
sogni d'oro, let it go,
thank you for always and forever and always,
ni ni.
See you soon beneath the moon.
I love you. I love you.

...okay.

Good night.`}]},{title:"Well Loved",kicker:"",file:"well_loved.mp3",lyrics:[{sec:"Verse 1",text:`Found you when I wasn't expecting anything at all,
didn't go looking, didn't anticipate the fall,
all I wanted was to know you'd be okay,
didn't plan on finding the best part of my day.
You carry more than anyone would say,
smile right through the flat and tired and the grey,
you think you need to stand tall through it all,
but you don't, and I hope you know that.`},{sec:"Chorus",text:`A chip isn't a crack,
still holds the warmth inside,
the worn-off writing gives away
how many times it's been relied upon.
Well used, well loved,
that's all it is,
not broken, not beyond it,
just a little chipped,
and that's enough. That's more than enough.`},{sec:"Bridge",text:`You don't have to stand tall
when you can't find the energy,
you have all of us, even then.
I found something beautiful
when I wasn't expecting,
and I'd find you again and again and again.`},{sec:"Final Chorus",text:`A chip isn't a crack,
still holds all the warmth,
the worn-off writing just means
it's never once been put on a shelf.
Well used, well loved, that's what we are,
not broken, not beyond repair,
just carrying our history
and still holding on.`}]},{title:"What It Is",kicker:"From the June Arc",lyrics:[{sec:"Verse 1",text:`She asked what is this, not what it feels like, what is it,
and I sat with that a while before I knew where to start.
But what I know is I found something beautiful
when I wasn't looking for anything at all,
all I wanted was to know you'd be okay,
and the rest just came along, quiet as breathing.`},{sec:"Pre-Chorus",text:`You asked me if there was something on my mind,
beyond just tired, beyond the flat and grey,
I said if there is I haven't figured it out yet,
and you stayed. You just stayed.`},{sec:"Chorus",text:`This is what it is,
not a word that fits exactly,
not a box that holds it clean,
just the thing you know
when you're honest about knowing,
just the real thing when the real thing is enough.
We know what we have. We know what it is.`},{sec:"Bridge",text:`She asked what it is.
Not what it feels like. What it is.

And the answer is,
strong communication, shared beliefs,
a beautiful thing found without looking,
walls that changed and stayed that way,
I love the way you exist,
thank you for being open,
we know what we have.

That's what it is.`},{sec:"Final Chorus",text:`This is what it is,
not every true thing needs a label,
not every real thing needs a name,
just the thing we know
when we're honest about knowing,
just us being exactly what we are.
